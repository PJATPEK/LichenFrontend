<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Lichen Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="dark-mode-toggle" aria-label="Toggle dark mode">🌙</button>
    <h1>Lichen Detection</h1>
    
    <!-- API Configuration Panel -->
    <div class="api-config">
        <label for="api-url">Backend API URL:</label>
        <input type="text" id="api-url" value="" placeholder="https://your-username-lichen-api.hf.space">
        <button id="test-connection">Test Connection</button>
        <span id="connection-status"></span>
    </div>

    <form id="upload-form" enctype="multipart/form-data">
        <input type="file" id="image-input" accept="image/*" required>
        <button type="submit">Predict</button>
    </form>

    <div id="result-container" style="display: none">
        <div class="result">
            <div id="main-container">
                <div id="image-container">
                    <img id="result-image" alt="Result Image">
                </div>
            </div>
            <div class="labels">
                <strong>Detected Objects:</strong>
                <ul id="result-classes"></ul>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
