<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Lichen Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="dark-mode-toggle" aria-label="Toggle dark mode">🌙</button>
    <h1>Lichen Detection (Model V.d0)</h1>

    <!-- API config kept in DOM for JS compatibility but completely hidden -->
    <div class="api-config" style="display:none;">
        <input type="text" id="api-url" value="https://PjetpAAAAAk-lichen-detection-api.hf.space">
        <span id="connection-status"></span>
    </div>

    <form id="upload-form" enctype="multipart/form-data">
        <input type="file" id="image-input" accept="image/*" required>
        <button type="submit">Predict</button>
    </form>

    <div id="result-container" style="display: none">
        <div class="result">
            <div id="main-container">
                <div id="image-container">
                    <img id="result-image" alt="Result Image">
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
